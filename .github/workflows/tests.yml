name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  statevector:
    name: Statevector and example (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1.12.6'
      - name: Install lightweight environment
        run: julia --project=examples --startup-file=no -e 'using Pkg; Pkg.instantiate()'
      - name: Parse archived Julia sources
        run: julia --startup-file=no tests/parse_sources.jl
      - name: Check projectors, trajectories, and entropy conventions
        run: julia --project=examples --startup-file=no tests/statevector_smoke.jl
      - name: Run README command
        run: julia --project=examples --startup-file=no examples/quickstart.jl
      - name: Check reference output and failure cases
        run: julia --project=examples --startup-file=no tests/quickstart_smoke.jl
      - name: Check MPS example interface contracts
        run: julia --project=examples --startup-file=no tests/model_examples.jl
      - name: Run every-sweep NN-NNN example
        run: julia --project=examples --startup-file=no examples/quickstart.jl --config examples/nnn/config.toml --output results/nnn_gallery
      - name: Install plotting dependency
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Matplotlib
        run: python -m pip install -r examples/requirements-plot.txt
      - name: Check example plots and saved data
        run: python tests/plot_examples.py
      - name: Verify source and figure integrity
        run: python tests/repository_integrity.py

  mps:
    name: Small MPS trajectories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1.12.6'
      - name: Install full locked environment
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.instantiate()'
      - name: Test TT and dimer MPS runs
        run: julia --project=. --startup-file=no --compiled-modules=no --compile=min -O0 tests/mps_smoke.jl
      - name: Run trivial model gallery example
        run: julia --project=. --startup-file=no --compiled-modules=no --compile=min -O0 examples/trivial/run.jl
      - name: Run dimer model gallery example
        run: julia --project=. --startup-file=no --compiled-modules=no --compile=min -O0 examples/dimer/run.jl
